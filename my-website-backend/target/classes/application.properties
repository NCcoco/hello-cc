# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update # Options: none, validate, update, create, create-drop
spring.jpa.show-sql=true # Show SQL queries in logs, useful for debugging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# For MySQL 8 and later, MySQL8Dialect is preferred, but MySQLDialect is often compatible.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
